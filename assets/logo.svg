<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 96 710 170" width="1420" height="340" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">OpenLedger</title>
  <defs>
    <clipPath id="capN"><rect x="340" y="156" width="80" height="56"/></clipPath>
